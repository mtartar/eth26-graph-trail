[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
markers = ["integration: hits the real Anthropic API, needs ANTHROPIC_API_KEY (run with -m integration)"]
addopts = "-m 'not integration'"
