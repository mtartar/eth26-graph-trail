<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graph Trail system architecture showing frontend-backend HTTP communication, three API routers, service layer, and external integrations" style="background: white;">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827">
    Graph Trail Architecture
  </text>

  <!-- FRONTEND LAYER -->
  <g id="frontend">
    <rect x="300" y="70" width="400" height="90" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="500" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Frontend Layer</text>
    <rect x="350" y="115" width="300" height="35" rx="4" fill="#bfdbfe" stroke="#1e40af" stroke-width="1.5"/>
    <text x="500" y="137" text-anchor="middle" font-size="12" fill="#111827">Streamlit UI (localhost:8501)</text>
  </g>

  <!-- HTTP Arrow -->
  <line x1="500" y1="160" x2="500" y2="200" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="520" y="185" font-size="11" fill="#374151">HTTP requests</text>

  <!-- BACKEND LAYER -->
  <g id="backend">
    <rect x="200" y="200" width="600" height="140" rx="8" fill="#fef2f2" stroke="#991b1b" stroke-width="2"/>
    <text x="500" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">FastAPI Backend (localhost:8010)</text>

    <!-- Three Routers -->
    <rect x="230" y="245" width="130" height="70" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="295" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">GET /transfers</text>
    <text x="295" y="283" text-anchor="middle" font-size="10" fill="#111827">(with filters:</text>
    <text x="295" y="298" text-anchor="middle" font-size="10" fill="#111827">token, amount, time)</text>

    <rect x="435" y="245" width="130" height="70" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="500" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">POST /query</text>
    <text x="500" y="283" text-anchor="middle" font-size="10" fill="#111827">(NL question →</text>
    <text x="500" y="298" text-anchor="middle" font-size="10" fill="#111827">filter → transfers)</text>

    <rect x="640" y="245" width="130" height="70" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="705" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">POST /summary</text>
    <text x="705" y="283" text-anchor="middle" font-size="10" fill="#111827">(transfers →</text>
    <text x="705" y="298" text-anchor="middle" font-size="10" fill="#111827">narrative)</text>
  </g>

  <!-- Arrows from routers down to services -->
  <line x1="295" y1="315" x2="295" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="315" x2="500" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="705" y1="315" x2="705" y2="370" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- SERVICE LAYER -->
  <g id="services">
    <rect x="150" y="370" width="700" height="200" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="500" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Service Layer</text>

    <!-- Data Source Service -->
    <rect x="170" y="415" width="140" height="60" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="240" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Data Source</text>
    <text x="240" y="452" text-anchor="middle" font-size="9" fill="#111827">(fixture | Token API)</text>
    <text x="240" y="467" text-anchor="middle" font-size="9" fill="#111827">→ transfers</text>

    <!-- NL Processing -->
    <rect x="370" y="415" width="140" height="60" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="440" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">NL Processing</text>
    <text x="440" y="452" text-anchor="middle" font-size="9" fill="#111827">NL to Filter</text>
    <text x="440" y="467" text-anchor="middle" font-size="9" fill="#111827">(Anthropic)</text>

    <!-- Narrative Service -->
    <rect x="570" y="415" width="140" height="60" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="640" y="435" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Narrative</text>
    <text x="640" y="452" text-anchor="middle" font-size="9" fill="#111827">Summary Gen</text>
    <text x="640" y="467" text-anchor="middle" font-size="9" fill="#111827">(Anthropic)</text>

    <!-- Filtering & Explorer URLs -->
    <rect x="770" y="415" width="70" height="60" rx="4" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="805" y="440" text-anchor="middle" font-size="9" font-weight="bold" fill="#111827">Filtering</text>
    <text x="805" y="458" text-anchor="middle" font-size="9" fill="#111827">Explorers</text>

    <!-- Data flow arrows within services -->
    <path d="M 310 440 L 370 440" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="335" y="430" text-anchor="middle" font-size="9" fill="#374151">filter</text>

    <path d="M 510 440 L 570 440" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="540" y="430" text-anchor="middle" font-size="9" fill="#374151">transfers</text>

    <!-- Utilities to the right -->
    <path d="M 710 440 L 770 440" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Response paths back up -->
    <path d="M 240 475 Q 240 505 295 505 Q 295 510 295 540" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="250" y="520" font-size="9" fill="#374151">transfers</text>

    <path d="M 440 475 Q 440 510 440 540" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="410" y="520" font-size="9" fill="#374151">transfers</text>

    <path d="M 640 475 Q 640 510 640 540" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="610" y="520" font-size="9" fill="#374151">narrative</text>
  </g>

  <!-- Response Arrow back to Frontend -->
  <line x1="500" y1="585" x2="500" y2="615" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <text x="480" y="605" font-size="11" fill="#374151">JSON response</text>

  <!-- EXTERNAL INTEGRATIONS -->
  <g id="external">
    <text x="100" y="680" font-size="12" font-weight="bold" fill="#111827">External APIs:</text>

    <!-- The Graph -->
    <rect x="40" y="700" width="140" height="60" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="110" y="720" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">The Graph</text>
    <text x="110" y="738" text-anchor="middle" font-size="9" fill="#111827">Token API</text>
    <text x="110" y="754" text-anchor="middle" font-size="9" fill="#111827">(stablecoin transfers)</text>

    <path d="M 240 440 Q 160 480 140 700" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-accent)"/>
    <text x="170" y="580" font-size="9" fill="#3b82f6">live data</text>

    <!-- Anthropic API -->
    <rect x="430" y="700" width="140" height="60" rx="4" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="500" y="720" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Anthropic API</text>
    <text x="500" y="738" text-anchor="middle" font-size="9" fill="#111827">Claude LLM</text>
    <text x="500" y="754" text-anchor="middle" font-size="9" fill="#111827">(NL processing)</text>

    <path d="M 440 475 L 440 650 Q 440 680 500 700" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-accent)"/>
    <path d="M 640 475 L 640 650 Q 640 680 570 700" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-accent)"/>
    <text x="600" y="590" font-size="9" fill="#3b82f6">API calls</text>

    <!-- Block Explorer -->
    <rect x="820" y="700" width="140" height="60" rx="4" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.5"/>
    <text x="890" y="720" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Block Explorer</text>
    <text x="890" y="738" text-anchor="middle" font-size="9" fill="#111827">Links to</text>
    <text x="890" y="754" text-anchor="middle" font-size="9" fill="#111827">transactions</text>

    <path d="M 805 452 Q 850 575 890 700" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="840" y="570" font-size="9" fill="#374151">tx_hash</text>
  </g>

  <!-- Data sources (alternate to Token API) -->
  <g id="data-sources">
    <text x="100" y="665" font-size="11" fill="#111827">Data sources:</text>
    <rect x="40" y="655" width="50" height="20" rx="3" fill="#fce7f3" stroke="#be185d" stroke-width="1"/>
    <text x="65" y="667" text-anchor="middle" font-size="9" fill="#111827">Fixture</text>
  </g>
</svg>